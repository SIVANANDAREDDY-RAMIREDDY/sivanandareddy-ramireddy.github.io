<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cursor Animation Showcase Demo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Times New Roman', Times, serif; background: #0f172a; color: #f8fafc; }
    canvas { background: #090d16; border-radius: 0.75rem; }
  </style>
</head>
<body class="p-6 flex flex-col items-center min-h-screen justify-center">

  <div class="max-w-3xl w-full space-y-4">
    <div class="flex justify-between items-center border-b border-slate-700 pb-3">
      <h1 class="text-2xl font-bold text-sky-400">Interactive Cursor Animation Preview</h1>
      <span class="text-xs bg-slate-800 text-slate-300 px-3 py-1 rounded-full border border-slate-600">Simulated Playback</span>
    </div>

    <!-- Mode Selector Controls -->
    <div class="flex flex-wrap gap-2 text-sm font-semibold">
      <button onclick="setMode('constellation')" id="btn-constellation" class="px-4 py-1.5 rounded bg-sky-600 text-white">1. Constellation / Dot Connect</button>
      <button onclick="setMode('reticle')" id="btn-reticle" class="px-4 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">2. Rotating Reticle</button>
      <button onclick="setMode('magnetic')" id="btn-magnetic" class="px-4 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700">3. Magnetic Blob / Trailer</button>
    </div>

    <!-- Simulation Canvas Container -->
    <div class="relative">
      <canvas id="preview-stage" width="760" height="420" class="w-full border border-slate-700 shadow-2xl"></canvas>
      <div id="status-tag" class="absolute bottom-4 left-4 bg-slate-900/80 backdrop-blur px-3 py-1.5 rounded border border-slate-700 text-xs text-slate-300">
        Move your mouse over the screen to interact
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('preview-stage');
    const ctx = canvas.getContext('2d');
    let mode = 'constellation';

    let pointer = { x: canvas.width / 2, y: canvas.height / 2, trailX: canvas.width / 2, trailY: canvas.height / 2 };
    let reticleAngle = 0;

    // Constellation satellites
    const nodes = [];
    for (let i = 0; i < 22; i++) {
      nodes.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        vx: (Math.random() - 0.5) * 1.5,
        vy: (Math.random() - 0.5) * 1.5,
        radius: Math.random() * 2 + 1.5
      });
    }

    function setMode(newMode) {
      mode = newMode;
      ['constellation', 'reticle', 'magnetic'].forEach(m => {
        const btn = document.getElementById('btn-' + m);
        if (m === newMode) {
          btn.className = "px-4 py-1.5 rounded bg-sky-600 text-white";
        } else {
          btn.className = "px-4 py-1.5 rounded bg-slate-800 text-slate-300 hover:bg-slate-700";
        }
      });
    }

    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      pointer.x = (e.clientX - rect.left) * (canvas.width / rect.width);
      pointer.y = (e.clientY - rect.top) * (canvas.height / rect.height);
    });

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Smooth trailer interpolation
      pointer.trailX += (pointer.x - pointer.trailX) * 0.15;
      pointer.trailY += (pointer.y - pointer.trailY) * 0.15;

      if (mode === 'constellation') {
        // Mode 1: Constellation & Connecting Nodes
        nodes.forEach((n, idx) => {
          n.x += n.vx;
          n.y += n.vy;
          if (n.x < 0 || n.x > canvas.width) n.vx *= -1;
          if (n.y < 0 || n.y > canvas.height) n.vy *= -1;

          const dx = pointer.x - n.x;
          const dy = pointer.y - n.y;
          const d = Math.sqrt(dx * dx + dy * dy);

          if (d < 150) {
            ctx.beginPath();
            ctx.moveTo(n.x, n.y);
            ctx.lineTo(pointer.x, pointer.y);
            ctx.strokeStyle = `rgba(14, 165, 233, ${1 - d / 150})`;
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
          ctx.fillStyle = '#38bdf8';
          ctx.fill();
        });

        // Center dot
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#0284c7';
        ctx.fill();

      } else if (mode === 'reticle') {
        // Mode 2: Rotating Reticle & Compass Ticks
        reticleAngle += 0.03;
        ctx.save();
        ctx.translate(pointer.trailX, pointer.trailY);
        ctx.rotate(reticleAngle);

        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 24, 0, Math.PI * 2);
        ctx.stroke();

        // 4 compass tick marks
        [0, Math.PI / 2, Math.PI, (3 * Math.PI) / 2].forEach(angle => {
          const x1 = Math.cos(angle) * 20;
          const y1 = Math.sin(angle) * 20;
          const x2 = Math.cos(angle) * 28;
          const y2 = Math.sin(angle) * 28;
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        });
        ctx.restore();

        // Pointer core dot
        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 3, 0, Math.PI * 2);
        ctx.fillStyle = '#38bdf8';
        ctx.fill();

      } else if (mode === 'magnetic') {
        // Mode 3: Fluid Magnetic Follower
        ctx.beginPath();
        ctx.arc(pointer.trailX, pointer.trailY, 20, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.4)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(pointer.x, pointer.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = '#0284c7';
        ctx.fill();
      }

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
